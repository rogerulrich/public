<style>
:root{
  --red:#DA291C; --red-700:#B01F14; --red-50:#FDF1EF; --red-100:#FADBD7; --salmon:#EFA59E;
  --ink:#1D2125; --ink-2:#454C55; --muted:#757D87; --line:#E5E7EA; --line-2:#F0F1F3;
  --bg:#F5F6F8; --card:#fff;
  --ok:#17804F; --ok-50:#E6F4EC; --warn:#B86A00; --warn-50:#FFF2DC; --yel:#8A7300; --yel-50:#FFF8D6;
  --blue:#1F5FD1; --blue-50:#E9F0FD; --violet:#6B3FC9; --violet-50:#F0EAFD; --teal:#0E7C7B; --teal-50:#E2F4F3;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07); --sh-lg:0 12px 32px rgba(16,24,40,.18);
  --font:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.nowrap{white-space:nowrap}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px}
.sidebar .logo{display:block;padding:0 10px 22px}
.sidebar .logo img{width:100%;max-width:200px;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--ink-2);font-weight:500;position:relative}
.nav a:hover{background:var(--line-2)}
.nav a.active{background:var(--red-50);color:var(--red)}
.nav a.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--red)}
.nav .count{margin-left:auto;background:var(--line-2);color:var(--ink-2);font-size:12px;font-weight:600;padding:1px 8px;border-radius:20px}
.nav a.active .count{background:var(--red);color:#fff}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.9);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:14px 32px;border-bottom:1px solid transparent}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:transparent;color:var(--ink);min-width:0}
.search:focus-within{border-color:var(--red);box-shadow:0 0 0 3px var(--red-100)}
.proto{font-size:12px;font-weight:600;color:var(--red);background:var(--red-50);border:1px solid var(--red-100);padding:3px 10px;border-radius:20px;white-space:nowrap}
.topbar .date{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.content{padding:8px 32px 48px;max-width:1440px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:12px 0 20px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:4px}
.mobile-head,.bottom-nav,.fab{display:none}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.card-b{padding:16px 18px}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:16px 18px;cursor:pointer;transition:transform .12s, box-shadow .12s;display:flex;flex-direction:column;gap:6px}
.kpi:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(16,24,40,.08)}
.kpi .lbl{color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.red .val{color:var(--red)} .kpi.warn .val{color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--line-2)}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-700);border-color:var(--red-700)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn-ok:hover{background:#106a40}
.btn-sm{height:32px;padding:0 10px;font-size:14px}
.btn-icon{width:38px;padding:0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;line-height:18px}
.b-red{background:var(--red);color:#fff} .b-red-soft{background:var(--red-50);color:var(--red)}
.b-warn{background:var(--warn-50);color:var(--warn)} .b-yel{background:var(--yel-50);color:var(--yel)}
.b-ok{background:var(--ok-50);color:var(--ok)} .b-blue{background:var(--blue-50);color:var(--blue)}
.b-grey{background:var(--line-2);color:var(--ink-2)} .b-violet{background:var(--violet-50);color:var(--violet)} .b-teal{background:var(--teal-50);color:var(--teal)}
.art{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;gap:7px;align-items:center;color:var(--ink-2)}
.chip .n{font-size:12px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on .n{color:#c9cdd2}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 16px}
select.sel,.input,textarea.input{height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 11px;outline:0;min-width:0}
textarea.input{height:auto;min-height:74px;padding:9px 11px;resize:vertical;width:100%}
select.sel:focus,.input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-100)}

.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:11px 14px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap;cursor:pointer;user-select:none}
table.t th.ns{cursor:default}
table.t td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:#FBF7F6}
table.t tbody tr:last-child td{border-bottom:0}
.t-title{font-weight:600}
.urg{width:4px;border-radius:3px;height:34px;background:transparent}
.urg.u1{background:var(--warn)} .urg.u2{background:var(--red)}
.list-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);font-size:13px;color:var(--muted);flex-wrap:wrap;gap:8px}

.cards{display:none}
.kcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--sh);position:relative;overflow:hidden;cursor:pointer}
.kcard.u1{border-left:4px solid var(--warn)} .kcard.u2{border-left:4px solid var(--red)}
.kcard .row1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.kcard .addr{font-weight:600;font-size:16px;margin:8px 0 2px}
.kcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kcard .acts{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px}
.kcard .acts .btn{flex:1;height:36px}

.li{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:#FBF7F6}
.li .when{width:58px;flex:none;text-align:center;border-radius:9px;background:var(--line-2);padding:6px 0;line-height:1.15}
.li .when b{display:block;font-size:17px}
.li .when span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.li .when.today{background:var(--red);color:#fff}.li .when.today span{color:#fde3e0}
.li .body{flex:1;min-width:0}
.li .body .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .body .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--red);opacity:.88;transition:opacity .12s}
.chart .bar:hover{opacity:1}
.chart .bar.cur{fill:var(--red-700)}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--font)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
.meter{height:8px;background:var(--line-2);border-radius:6px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}

/* detail */
.detail-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin:6px 0 18px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;margin-top:10px}
.back:hover{color:var(--red)}
.status-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field .input,.field select.sel{width:100%}
.field .req{color:var(--red)}
.input-ic{display:flex;gap:6px}
.input-ic .input{flex:1}
.timeline{list-style:none;margin:0;padding:4px 18px 14px}
.timeline li{display:flex;gap:12px;padding:10px 0;position:relative}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:15px;top:42px;bottom:-4px;width:2px;background:var(--line-2)}
.tl-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--line-2);color:var(--ink-2)}
.tl-ic svg.i{width:16px;height:16px}
.tl-ic.call{background:var(--blue-50);color:var(--blue)} .tl-ic.termin{background:var(--ok-50);color:var(--ok)} .tl-ic.frist{background:var(--warn-50);color:var(--warn)} .tl-ic.new{background:var(--red-50);color:var(--red)}
.side-actions{display:flex;flex-direction:column;gap:8px;padding:16px 18px}
.side-actions .btn{justify-content:flex-start;height:42px}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 4px;display:flex;justify-content:flex-end;gap:8px}

/* calendar */
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.day{background:#fff;border:1px solid var(--line);border-radius:var(--r);min-height:280px;display:flex;flex-direction:column}
.day.today{border-color:var(--red);box-shadow:0 0 0 2px var(--red-100)}
.day-h{padding:10px 12px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-size:20px}
.day.today .day-h b{color:var(--red)}
.day-b{padding:8px;display:flex;flex-direction:column;gap:6px}
.ev{border-radius:8px;padding:7px 9px;font-size:13px;line-height:1.3;cursor:pointer;border-left:4px solid;background:var(--line-2)}
.ev:hover{filter:brightness(.97)}
.ev .tm{font-weight:700;font-size:12px}
.ev.done{opacity:.55;text-decoration:line-through}
.agenda{display:none}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:var(--red);border-bottom-color:var(--red)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(17,20,24,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--sh-lg);animation:pop .18s}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px}
.modal-h h2{font-size:18px}
.modal-b{padding:10px 20px 6px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px}
.hint-box{background:var(--line-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--red);margin-top:2px;flex:none}
.radio-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio-row label{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.radio-row input{accent-color:var(--red)}
.radio-row label:has(input:checked){border-color:var(--red);background:var(--red-50)}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
@keyframes up{from{transform:translateY(100%)}}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--sh-lg);z-index:200;display:flex;gap:10px;align-items:center;font-weight:500;animation:pop .2s;max-width:calc(100vw - 32px)}
.toast svg.i{color:#7BE0A8}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;z-index:300;background:radial-gradient(1200px 600px at 10% -10%,var(--red-50),transparent 60%),var(--bg);display:none;overflow:auto}
#login.on{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(16,24,40,.10);padding:30px 26px 24px}
.login-card .lg{display:block;width:230px;max-width:80%;margin:0 auto 22px}
.login-card h1{font-size:20px;text-align:center;margin-bottom:4px}
.login-card .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
.login-card form{display:flex;flex-direction:column;gap:12px}
.login-card .input{height:46px;width:100%;font-size:16px}
.login-card .btn{height:46px;font-size:16px;width:100%}
.bio-btn{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:18px 12px;border:1px solid var(--red-100);background:var(--red-50);color:var(--red);border-radius:14px;cursor:pointer;font-weight:600;margin-bottom:6px}
.bio-btn svg.i{width:44px;height:44px;stroke-width:1.6}
.bio-btn small{color:var(--ink-2);font-weight:400}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.demo{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px;text-align:center}
.demo .chips{justify-content:center;margin-top:8px}
.err{color:var(--red);font-size:14px;min-height:20px;text-align:center}
.fp-pulse{width:96px;height:96px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:var(--red-50);color:var(--red);animation:pulse 1.4s infinite}
.fp-pulse svg.i{width:54px;height:54px;stroke-width:1.5}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(218,41,28,.35)}70%{box-shadow:0 0 0 22px rgba(218,41,28,0)}100%{box-shadow:0 0 0 0 rgba(218,41,28,0)}}
.side-foot:hover{background:var(--line-2);border-radius:10px}
.map-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.map-links .btn{height:30px;font-size:13px;padding:0 10px}
.map-links svg.i{width:15px;height:15px}

/* ---------- Mobile ---------- */
@media (max-width:1180px){ .g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))} .week{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:900px){
  body{font-size:15px}
  .app{display:block}
  .sidebar,.topbar{display:none}
  .mobile-head{display:flex;position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  .mobile-head img{height:30px;display:block}
  .content{padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
  h1{font-size:22px}
  .page-head{margin:14px 0 14px}
  .page-head .btn-row .hide-m{display:none}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g-kpi .kpi:first-child{grid-column:1/-1}
  .g-2,.g-2e,.g-3{grid-template-columns:minmax(0,1fr)}
  .grid>*{min-width:0}
  .kpi{padding:13px 14px}.kpi .val{font-size:26px}
  .desktop-only{display:none !important}
  .cards{display:flex;flex-direction:column;gap:10px}
  .form-grid{grid-template-columns:1fr}
  .week{display:none}.agenda{display:block}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 0;position:relative}
  .bottom-nav a svg.i{width:22px;height:22px}
  .bottom-nav a.active{color:var(--red)}
  .bottom-nav .bn-count{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:0 5px;line-height:16px}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(218,41,28,.45);z-index:41;border:0}
  .fab svg.i{width:26px;height:26px}
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;animation:up .22s;padding-bottom:env(safe-area-inset-bottom)}
  .filters .sel{flex:1 1 30%}
  .filters .search-m{display:flex !important}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom))}
  .sticky-save{bottom:calc(64px + env(safe-area-inset-bottom))}
  .sticky-save .btn{flex:1}
  .detail-head .btn-row{width:100%}
}
.search-m{display:none !important;width:100%;max-width:none}
</style>
</head>

/* ---------- Status-Logik (entspricht den Excel-Formeln & bedingten Formatierungen) ---------- */
function fristBadge(s){ // Rest-Tage = Frist - HEUTE()
  const d=diff(s);
  if(d<0) return `<span class="badge b-red">überfällig ${-d} T</span>`;
  if(d<=30) return `<span class="badge b-warn">${d===0?'heute':'noch '+d+' T'}</span>`;
  if(d<=90) return `<span class="badge b-yel">noch ${d} T</span>`;
  return `<span class="badge b-grey">noch ${d} T</span>`;
}
function terminInfo(s){ // Spalte "Datum": Vergangen / Heute / Morgen / Diese Woche / Nächste Woche / Bald
  if(!s) return null; const d=diff(s);
  if(d<0) return ['Vergangen','b-red-soft'];
  if(d===0) return ['Heute','b-red'];
  if(d===1) return ['Morgen','b-warn'];
  if(d<=4) return ['Diese Woche','b-blue'];
  if(d<=7) return ['Nächste Woche','b-blue'];
  return ['Bald','b-grey'];
}
function terminBadge(k){
  const t=terminInfo(k.termin);
  if(!t) return '<span class="badge b-grey" style="background:transparent;border:1px dashed var(--line);color:var(--muted)">kein Termin</span>';
  return `<span class="badge ${t[1]}">${t[0]}</span>`;
}
const artTag=c=>{const a=ART(c);return `<span class="badge ${a.cls} art" title="${esc(a.name)}">${esc(a.code)}</span>`};
const urgBadge=k=>k.dringend==2?'<span class="badge b-red-soft">'+ic('alert','style="width:13px;height:13px"')+'sehr dringend</span>':k.dringend==1?'<span class="badge b-warn">dringend</span>':'';
const ktDot=id=>{const k=KT(id);return `<span class="nowrap" style="display:inline-flex;gap:6px;align-items:center"><span class="dot" style="background:${k.color}"></span>${esc(k.name)}</span>`};
const telLink=t=>t&&/\d{3}/.test(t)?`<a href="tel:${esc(t.replace(/[^\d+]/g,'').slice(0,13))}" onclick="event.stopPropagation()" style="color:var(--blue)">${esc(t)}</a>`:esc(t||'–');
const mapUrl=k=>`https://maps.google.com/?q=${encodeURIComponent(k.adresse+', '+k.plz+' '+k.ort)}`;

function filterOpen(chip=ui.chip){
  const q=ui.q.trim().toLowerCase();
  return state.open.filter(k=>{
    if(q && ![k.adresse,k.ort,k.plz,k.eigentuemer,k.zaehler,k.objekt,k.bem1,k.bem2,k.projekt].join(' ').toLowerCase().includes(q)) return false;
    if(ui.art && k.art!==ui.art) return false;
    if(ui.ort && k.ort!==ui.ort) return false;
    if(ui.kt && k.kontrolleur!==ui.kt) return false;
    const d=diff(k.frist);
    switch(chip){
      case 'meine': return k.kontrolleur===me()?.kt;
      case 'ohne': return !k.termin;
      case 'termin': return !!k.termin;
      case 'ueber': return d<0;
      case 'bald': return d>=0&&d<=30;
      case 'dringend': return k.dringend>0;
      case 'rueck': return k.termin&&diff(k.termin)<0;
    }
    return true;
  });
}
function sortList(a){
  const f={frist:k=>k.frist,termin:k=>k.termin||'9999',ort:k=>k.ort,art:k=>k.art,eig:k=>k.eigentuemer.toLowerCase(),kt:k=>k.kontrolleur,adr:k=>k.adresse}[ui.sort];
  return a.slice().sort((x,y)=>(y.dringend>0&&ui.sort==='frist'&&false)?1:(f(x)<f(y)?-ui.dir:f(x)>f(y)?ui.dir:0));
}

    <div class="body"><div class="t1">${esc(k.zeit||'')} · ${esc(k.adresse)}, ${esc(k.ort)}</div><div class="t2">${esc(ART(k.art).name)} · ${esc(k.objekt)} · ${esc(k.eigentuemer)}</div></div>
    ${ktDot(k.kontrolleur)}</div>`;

function barChart(data,tt,fmt=v=>v){
  const W=640,H=220,pl=30,pb=26,pt=14,max=Math.max(1,...data.map(d=>d.v)),step=niceStep(max),top=Math.ceil(max/step)*step;
  const bw=(W-pl)/data.length;
  let g='';
  for(let v=0;v<=top;v+=step){const y=pt+(H-pt-pb)*(1-v/top);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#EEF0F2"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
  data.forEach((d,i)=>{const h=(H-pt-pb)*d.v/top,x=pl+i*bw+bw*.2,y=H-pb-h;
    g+=`<rect class="bar ${i===data.length-1?'cur':''}" x="${x}" y="${y}" width="${bw*.6}" height="${Math.max(h,0)}" rx="4"><title>${d.l}: ${tt(d.v)}</title></rect>
    <text x="${x+bw*.3}" y="${H-8}" text-anchor="middle">${d.l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function niceStep(m){const r=m/4,p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=r)}

function saveForm(){
  const form=document.getElementById('kform');
  const data=Object.fromEntries(new FormData(form));
  for(const r of ['adresse','ort','frist']) if(!data[r]){ const el=form.querySelector(`[name=${r}]`); el.focus(); el.style.borderColor='var(--red)'; toast('Bitte Pflichtfelder ausfüllen',true); return; }
  data.dringend=+data.dringend; data.periode=data.periode?+data.periode:null; data.aufwandH=+data.aufwandH||0;
  if(form.dataset.id){
    const k=state.open.find(x=>x.id===+form.dataset.id);
    const terminChanged=k.termin!==data.termin||k.zeit!==data.zeit;
    Object.assign(k,data);
    if(terminChanged&&data.termin) k.log.push({t:'termin',d:toISO(TODAY),txt:`Termin vereinbart: ${fdw(k.termin)} ${k.zeit}`});
    else k.log.push({t:'edit',d:toISO(TODAY),txt:'Angaben bearbeitet'});
    toast('Änderungen gespeichert'); render();
  } else {
    const k={...data,id:state.nextId++,nr:state.open.length+1,log:[{t:'new',d:toISO(TODAY),txt:'Kontrolle erfasst'}],fristHist:[]};
    state.open.push(k); toast('Kontrolle angelegt'); location.hash='#/kontrolle/'+k.id;
  }
}

function vTermine(){

  const days=[...Array(6)].map((_,i)=>addDays(i,mon));
  const kw=isoWeek(mon);
  const evFor=d=>[
    ...state.open.filter(k=>k.termin===d).map(k=>({k,done:false,zeit:k.zeit})),
    ...state.done.filter(k=>k.durchgefuehrt===d).map(k=>({k,done:true,zeit:''})),

  const ev=({k,done})=>{const c=KT(k.kontrolleur).color;return `<div class="ev ${done?'done':''}" style="border-color:${c};background:${c}12" ${done?'':`data-action="go" data-href="#/kontrolle/${k.id}"`}>
      <div class="tm">${done?'✓ erledigt':esc(k.zeit||'–')} · ${esc(KT(k.kontrolleur).kurz)}</div><div>${esc(k.adresse)}</div><div class="tiny muted">${esc(k.ort)} · ${esc(k.art)}</div></div>`};
  const plan=state.open.filter(k=>!k.termin).sort((a,b)=>a.frist.localeCompare(b.frist));

    <div class="btn-row"><button class="btn btn-icon" data-action="week" data-d="-1" aria-label="Vorherige Woche">${ic('left')}</button><button class="btn" data-action="week" data-d="0">Heute</button><button class="btn btn-icon" data-action="week" data-d="1" aria-label="Nächste Woche">${ic('right')}</button></div></div>

  <div class="week">${days.map(d=>{const e=evFor(d);return `<div class="day ${d===toISO(TODAY)?'today':''}"><div class="day-h"><span class="small muted" style="font-weight:600">${WT[parse(d).getDay()]}</span><b>${parse(d).getDate()}.</b></div><div class="day-b">${e.map(ev).join('')||'<div class="tiny muted" style="padding:6px">–</div>'}</div></div>`}).join('')}</div>
  <div class="agenda">${days.map(d=>{const e=evFor(d);return `<div style="margin:14px 0 8px;font-weight:600;${d===toISO(TODAY)?'color:var(--red)':''}">${['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][parse(d).getDay()]}, ${fd(d)}</div>
      ${e.length?`<div style="display:flex;flex-direction:column;gap:8px">${e.map(ev).join('')}</div>`:'<div class="tiny muted">Keine Termine</div>'}`}).join('')}</div>
  <div class="card" style="margin-top:22px"><div class="card-h"><h2>Noch zu planen <span class="muted" style="font-weight:400">· ohne Termin, nach Frist sortiert</span></h2><span class="badge b-grey">${plan.length}</span></div>
    ${plan.slice(0,10).map(k=>`<div class="li" data-action="go" data-href="#/kontrolle/${k.id}"><div class="body"><div class="t1">${esc(k.adresse)}, ${esc(k.ort)}</div><div class="t2">${esc(k.eigentuemer)} · ${telLink(k.telEig)}</div></div>${fristBadge(k.frist)}<button class="btn btn-sm" data-action="modal" data-m="termin" data-id="${k.id}">${ic('cal')}<span class="desktop-only">Termin</span></button></div>`).join('')}

}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}

  <div class="grid g-kpi" style="grid-template-columns:repeat(4,minmax(0,1fr))">

    <div class="card kpi" style="cursor:default"><div class="lbl">Ø pro Kontrolle</div><div class="val">${chf(d.length?ums/d.length:0)}</div><div class="hint">${d.filter(x=>x.abrechnung==='aufwand').length} nach Aufwand</div></div>
    <div class="card kpi warn" data-action="go" data-href="#/erledigt" onclick="ui.dfilter='nofakt'"><div class="lbl">Noch nicht verrechnet</div><div class="val">${chf(offen.reduce((s,x)=>s+x.betrag,0))}</div><div class="hint">${offen.length} Kontrollen →</div></div>

  <div class="card" style="margin-top:18px"><div class="card-h"><h2>Umsatz pro Monat ${y}</h2><span class="small muted">Balken antippen für Details</span></div>

    <div class="card"><div class="card-h"><h2>Pro Kontrollart</h2></div><table class="t"><thead><tr><th class="ns"></th><th class="ns" style="text-align:right">Anz.</th><th class="ns" style="text-align:right">Umsatz</th><th class="ns"></th></tr></thead><tbody>${byArt.map(x=>row(artTag(x.a.code),x.n,x.v,ums)).join('')}</tbody></table></div>

/* ---------- Anmeldung & Rollen ----------
   Prototyp: Benutzer/Passwörter nur im Browser simuliert (Passwort für alle Demo-Benutzer: "demo").
   Finale Version: ASP.NET Core Identity, Passwort-Hashes in SQLite, Passkeys/WebAuthn serverseitig geprüft. */
let session=null;
const me=()=>state.users.find(u=>u.username===session&&u.aktiv)||null;
const isAdmin=()=>me()?.rolle==='admin';
const initials=n=>n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const DEMO_PW='demo';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const BIO_KEY='gwe_bio';
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function bioAvailable(){
  try{ return !!(window.PublicKeyCredential&&window.isSecureContext&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; }
}

function showLogin(msg=''){
  document.querySelector('.app').style.display='none';
  document.getElementById('bnav').style.display='none';
  document.querySelector('.fab').style.display='none';
  const bio=store.get(BIO_KEY); const bu=bio&&state.users.find(u=>u.username===bio.username&&u.aktiv);
  const el=document.getElementById('login'); el.classList.add('on');
  el.innerHTML=`<div class="login-card">
    <img class="lg" src="${LOGO}" alt="GWE Elektrosicherheit">
    <h1>Kontrollen-Verwaltung</h1><div class="sub">Bitte melden Sie sich an</div>
    ${bu?`<button class="bio-btn" data-action="bio-login">${ic('fp')}Mit Fingerabdruck anmelden<small>${esc(bu.name)} · dieses Gerät</small></button><div class="or">oder mit Passwort</div>`:''}
    <form id="lform" onsubmit="return false">
      <input class="input" name="u" placeholder="Benutzername" autocomplete="username" autocapitalize="none" value="${bu?esc(bu.username):''}">
      <input class="input" name="p" type="password" placeholder="Passwort" autocomplete="current-password">
      <div class="err" id="lerr">${esc(msg)}</div>
      <button class="btn btn-primary" data-action="login">${ic('lock')}Anmelden</button>
    </form>
    <div class="demo"><div class="small muted">Prototyp – Demo-Zugänge (Passwort: <b>demo</b>)</div>
      <div class="chips">${state.users.filter(u=>u.aktiv).map(u=>`<button class="chip" data-action="demo-login" data-u="${esc(u.username)}">${esc(u.name)}</button>`).join('')}</div></div>
  </div>`;
}
function hideLogin(){
  document.getElementById('login').classList.remove('on');
  document.getElementById('login').innerHTML='';
  document.querySelector('.app').style.display='';
  document.getElementById('bnav').style.display='';
}
async function doLogin(username,{bio=false}={}){
  const u=state.users.find(x=>x.username===username);
  session=u.username; u.last=toISO(TODAY);
  try{sessionStorage.setItem('gwe_user',u.username)}catch(e){}
  hideLogin(); ui.chip='alle';
  if(!location.hash||location.hash==='#/') location.hash='#/uebersicht';
  render(); toast(`Angemeldet als ${u.name}`);
  // Mobile Benutzer: Fingerabdruck-Login anbieten
  if(!bio&&innerWidth<=900&&!store.get(BIO_KEY)) setTimeout(()=>offerBio(),700);
}
function offerBio(){
  modal('Fingerabdruck-Login aktivieren?',`<div class="fp-pulse">${ic('fp')}</div>
    <div style="text-align:center">Melden Sie sich auf diesem Gerät künftig mit Fingerabdruck oder Gesichtserkennung an – ohne Passwort einzutippen.</div>
    <div class="hint-box">${ic('lock')}<div>Der Fingerabdruck verlässt das Gerät nie. Gespeichert wird nur ein Gerätezertifikat (Passkey / WebAuthn).</div></div>`,
    `<button class="btn" type="button" data-action="close">Später</button><button class="btn btn-primary" type="button" data-action="bio-register">${ic('fp')}Aktivieren</button>`);
}
function bioSimDialog(title,onOk){
  modal(title,`<div class="fp-pulse">${ic('fp')}</div><div style="text-align:center">Finger auf den Sensor legen …</div>
    <div class="hint-box">${ic('bolt')}<div>Dieser Browser/Kontext unterstützt hier keinen echten Fingerabdruck (z.B. Datei lokal geöffnet). Im Prototyp wird der Vorgang simuliert. Über <b>https</b> auf dem Smartphone wird der echte Sensor verwendet.</div></div>`,
    `<button class="btn" type="button" data-action="close">Abbrechen</button><button class="btn btn-primary" type="button" id="simok">Erkannt (simulieren)</button>`);
  document.getElementById('simok').onclick=()=>{closeModal();onOk()};
}
async function bioRegister(){
  const u=me(); if(!u) return;
  const done=credId=>{store.set(BIO_KEY,{username:u.username,credId});u.bio=(u.bio||0)+1;closeModal();toast('Fingerabdruck-Login aktiviert');if(location.hash==='#/konto')render()};
  if(!await bioAvailable()) return bioSimDialog('Fingerabdruck registrieren',()=>done(null));
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'GWE Kontrollen'},
      user:{id:new TextEncoder().encode(u.username),name:u.username,displayName:u.name},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000}});
    done(b64(cred.rawId));
  }catch(e){ closeModal(); toast('Fingerabdruck wurde nicht registriert',true); }
}
async function bioLogin(){
  const bio=store.get(BIO_KEY); if(!bio) return;
  if(!bio.credId||!await bioAvailable()) return bioSimDialog('Mit Fingerabdruck anmelden',()=>doLogin(bio.username,{bio:true}));
  try{
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(bio.credId)}],userVerification:'required',timeout:60000}});
    doLogin(bio.username,{bio:true});
  }catch(e){ showLogin('Fingerabdruck nicht erkannt – bitte mit Passwort anmelden'); }
}

function vBenutzer(){

/* ---------- geo.ur.ch (amtliche Karte Kanton Uri) ----------
   Adresse -> LV95-Koordinaten über die öffentliche Suche von geo.admin.ch,
   danach Sprung auf geo.ur.ch mit Markierung. Finale Version: Koordinaten pro Objekt
   speichern und manuell korrigierbar (wichtig für Ställe/Alpen ohne Hausnummer). */
async function geocode(k){
  if(k.lv95) return k.lv95;
  const q=async(text,origins)=>{
    const r=await fetch(`https://api3.geo.admin.ch/rest/services/api/SearchServer?searchText=${encodeURIComponent(text)}&type=locations&origins=${origins}&sr=2056&limit=1`);
    const j=await r.json(); const a=j.results?.[0]?.attrs; if(!a) return null;
    const m=/BOX\(([\d.]+) ([\d.]+)/.exec(a.geom_st_box2d||''); return m?{e:Math.round(+m[1]),n:Math.round(+m[2])}:null;
  };
  try{
    let c=await q(`${k.adresse} ${k.plz} ${k.ort}`,'address'); if(c) return k.lv95={...c,exact:true};
    c=await q(`${k.adresse} ${k.ort}`,'address'); if(c) return k.lv95={...c,exact:true};
    c=await q(k.ort,'gg25'); if(c) return {...c,exact:false};
  }catch(e){}
  return null;
}
function geoUrUrl(c){
  if(!c) return 'https://geo.ur.ch/';
  if(!c.exact) return `https://geo.ur.ch/?center=${c.e},${c.n}&zoom=14`;
  const s={groupname:'coordinate',x:String(c.e),y:String(c.n),coordSys:'EPSG:2056',searchterm:`${c.e}/${c.n}`};
  return `https://geo.ur.ch/?center=${c.e},${c.n}&zoom=20&search=${encodeURIComponent(JSON.stringify(s))}`;
}

    if(!c) toast('Adresse nicht gefunden – bitte in geo.ur.ch suchen',true);
